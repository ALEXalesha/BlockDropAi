# Настройки выкладки на GitHub для tools/publish_github.sh (общий скрипт
# PythonAiGames/tools/publish_game.sh, там же описаны все поля). Читается через source.
REPO=ALEXalesha/BlockDropAi
# Описание и план (docs/spec.md, docs/plan.md) остаются только на Gitea: в них разобрано
# название игры вместе с товарным знаком (spec §0) - из публикуемой истории они вырезаются.
DROP_PATHS=(docs/spec.md docs/plan.md)
# Товарный знак - ни в файлах, ни в именах файлов, ни в сообщениях коммитов. Слово
# собирается из частей, чтобы не находиться в самом этом файле.
TEXT_FORBID="tet""ris"
# В ранних коммитах tests/test_blocks.py (ede7432..489dd9f) слово было в комментарии и имени
# теста - в публикуемой истории они заменяются на нынешние строки (в шаблонах слово разбито [r]).
TEXT_GREP='[Tt]et[r]is'
TEXT_SED=(
  's#\([Tt]et[r]is Guideline\)#(гайдлайн падающих блоков)#g'
  's#test_[t]etris_sends_four_and_cancels_pending#test_four_lines_send_four_and_cancel_pending#g'
)
